<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Earn your Class A CDL with hands-on training, flexible financing, and career-focused support at Iman Trucking School." />
    <link rel="icon" href="https://imantruckingschool.com/wp-content/uploads/2025/02/FAVICON-1-150x150.png" />
    <title>Iman Trucking School | The Road to Success</title>
    <style>
      #google_translate_element,
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      body > iframe.skiptranslate,
      #goog-gt-tt {
        display: none !important;
      }
      html,
      body {
        top: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.googleTranslateElementInit = function () {
        if (!window.google || !window.google.translate) return;
        new window.google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,ht,es",
            autoDisplay: false
          },
          "google_translate_element"
        );
      };
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
  </body>
</html>
